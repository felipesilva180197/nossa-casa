    <label class="check full" id="pagoLbl"><input type="checkbox" name="pago" ${e.pago?"checked":""}> Já está paga</label>
    <label class="check full"><input type="checkbox" name="estimado" ${e.estimado?"checked":""}> Valor estimado (confirmar quando a conta chegar)</label>
    ${isNew?`<p class="note full" style="margin:0">Comprou parcelado? <button type="button" class="btn small" data-toplan>Cadastrar compra parcelada</button></p>`:""}
  `,{submit:isNew?"Lançar":"Salvar", del:isNew?null:()=>deleteEntry(e.id)});
  const tp=f.querySelector("[data-toplan]"); if(tp) tp.onclick=()=>{ $("#dlg").close(); openPlan(); };
  const valorOrig=q("valor").value;
  let autoV=false;
  const showVal=()=>{ const v=parseMoney(q("valor").value); $("#valPrev").textContent=q("valor").value?(v>0?`Será lançado ${moneyF(v)} em ${monthName(q("month").value||S.month)}.`:"Valor inválido. Use o formato 1.250,90"):""; };
  const updDiv=wireDivisao(f);
  const applyForma=changeMonth=>{
    const fv=parseForma(q("forma").value), d=q("data").value, isCard=fv.forma==="cartao";
    $("#pagoLbl").style.display=isCard?"none":"";
    $("#vencLbl").style.display=isCard?"none":"";
    if(isCard){
      const card=cardById(fv.cartao);
      if(isNew) q("pago").checked=false;
      if(d&&changeMonth){ const m=faturaMonth(card,d); q("month").value=m; q("venc").value=faturaVenc(card,m); autoV=true; }
      $("#formaHint").textContent = card.fecha
        ? `Compras até o dia ${+card.fecha-1||"anterior"} entram na fatura do mês; a partir do dia ${card.fecha}, na do mês seguinte. ${d?"Esta vai na fatura de "+monthName(q("month").value)+".":"Preencha a data da compra."}`
        : "Informe o dia de fechamento do cartão em Ajustes para a fatura ser escolhida sozinha.";
    } else {
      $("#formaHint").textContent="";
      if(autoV){ q("venc").value=""; autoV=false; }
      if(changeMonth&&d&&!q("venc").value) q("month").value=d.slice(0,7);
    }
    showVal();
  };
  q("valor").addEventListener("input",()=>{ if(q("valor").value!==valorOrig) q("estimado").checked=false; showVal(); });
  q("month").addEventListener("change",showVal);
  q("forma").addEventListener("change",()=>applyForma(true));
  q("data").addEventListener("change",()=>applyForma(true));
  q("venc").addEventListener("change",()=>{ autoV=false; if(q("venc").value){ q("month").value=q("venc").value.slice(0,7); showVal(); } });
  q("desc").addEventListener("change",()=>{
    if(!isNew) return;
    const prev=[...S.entries].reverse().find(x=>!isParc(x)&&norm(x.desc)===norm(q("desc").value));
    if(prev){ q("cat").value=prev.cat; q("tipo").value=isFixa(prev)?"fixa":"variavel"; q("divisao").value=divOf(prev); updDiv("divisao"); q("forma").value=formaKey(prev); applyForma(true); }
    else if(!q("cat").value){ const g=guessCat(q("desc").value); if(g) q("cat").value=g; }
  });
  if(preset&&preset.forma) q("forma").value=preset.forma;
  applyForma(isNew);
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const d=new FormData(f), valor=parseMoney(d.get("valor")), desc=String(d.get("desc")||"").trim(), month=d.get("month")||S.month;
    if(!desc) return toast("Informe a descrição.");
    if(!(valor>0)){ q("valor").focus(); return toast("Valor inválido. Use o formato 1.250,90"); }
    if(!d.get("cat")){ q("cat").focus(); return toast("Escolha a vertente."); }
    const div=readDivisao(d,valor); if(!div) return;
    const fp=parseForma(d.get("forma"));
    if(isNew){
      const dup=monthEntries(month).find(x=>norm(x.desc)===norm(desc)&&Math.abs(x.valor-valor)<0.005);
      if(dup&&!(await askConfirm(`Já existe "${dup.desc}" de ${moneyF(dup.valor)} em ${monthName(month)}. Lançar de novo?`,"Lançar mesmo assim"))) return;
    }
    const now=new Date().toISOString();
    const obj={...e,desc,valor,month,cat:d.get("cat"),tipo:d.get("tipo"),...div,...fp,
      data:d.get("data")||"", venc:d.get("venc")||"", obs:String(d.get("obs")||"").trim(), estimado:!!d.get("estimado"),
      pago: fp.forma==="cartao" ? (isNew?false:!!e.pago) : !!d.get("pago"), atualizadoPor:S.me, atualizadoEm:now};
    if(isNew){ obj.criadoPor=S.me; obj.criadoEm=now; }
    if(!isNew&&(e.recId||e.auto)) obj.editadoManual=true;
    $("#dlg").close();
    await Store.put("lancamentos",obj);
    if(month!==S.month){ S.notice={desc,month,card:fp.forma==="cartao"}; render(); }
    toast(isNew?`Lançado ${moneyF(valor)} em ${monthName(month)}`:"Salvo");
    scheduleSync();
  };
  $("#dlg").showModal();
  if(isNew) q("desc").focus();
}

/* conta fixa */
function openRec(r){
  const isNew=!r;
  r=r||{id:uid(),desc:"",valor:"",cat:"",divisao:"metade",forma:"boleto",cartao:"",dia:"",variavelValor:false,ativo:true,inicio:"",fim:""};
  const {f,q}=formShell(isNew?"Nova conta fixa":"Editar conta fixa",`
    <p class="note full" style="margin:0">Aluguel, condomínio, internet, escola... Entra sozinha todo mês.</p>
    <label class="f full">Descrição<input name="desc" required value="${esc(r.desc)}" placeholder="Ex: Aluguel"></label>
    <label class="f">Valor (R$)<input name="valor" required inputmode="decimal" value="${fmtIn(r.valor)}"></label>
    <label class="f">Dia do vencimento<input name="dia" type="number" min="1" max="31" value="${esc(r.dia)}"></label>
    <label class="f">Vertente<select name="cat" required>${catOptions(r.cat)}</select></label>
    <label class="f">Forma de pagamento<select name="forma">${formaOptions(formaKey(r))}</select></label>
    ${divisaoFields(r)}
    <label class="f">Começa em (opcional)<input name="inicio" type="month" value="${esc(r.inicio||"")}"></label>
    <label class="f">Termina em (opcional)<input name="fim" type="month" value="${esc(r.fim||"")}"></label>
    <label class="check full"><input type="checkbox" name="variavelValor" ${r.variavelValor?"checked":""}> O valor muda todo mês (luz, água). O valor acima vira estimativa.</label>
    <label class="check full"><input type="checkbox" name="ativo" ${r.ativo!==false?"checked":""}> Ativa</label>
  `,{submit:"Salvar", del:isNew?null:()=>deleteRec(r.id)});
  wireDivisao(f);
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const d=new FormData(f), valor=parseMoney(d.get("valor")), inicio=d.get("inicio")||"", fim=d.get("fim")||"";
    if(!String(d.get("desc")).trim()) return toast("Informe a descrição.");
    if(!(valor>0)) return toast("Valor inválido. Use o formato 1.250,90");
    if(!d.get("cat")) return toast("Escolha a vertente.");
    if(inicio&&fim&&fim<inicio) return toast("O mês final é antes do inicial.");
    const div=readDivisao(d,valor); if(!div) return;
    const obj={...r,desc:String(d.get("desc")).trim(),valor,dia:parseInt(d.get("dia"))||"",cat:d.get("cat"),...div,...parseForma(d.get("forma")),
      inicio,fim,variavelValor:!!d.get("variavelValor"),ativo:!!d.get("ativo")};
    const i=S.recs.findIndex(x=>x.id===obj.id); if(i>=0) S.recs[i]=obj; else S.recs.push(obj);
    $("#dlg").close();
    await Store.put("fixas",obj);
    toast("Conta fixa salva. Atualizando os próximos meses.");
    syncRecs();
  };
  $("#dlg").showModal();
}

/* compra parcelada */
function openPlan(p){
  const isNew=!p;
  p=p||{id:uid(),desc:"",forma:"cartao",cartao:S.config.cartoes[0].id,modo:"parcela",valor:"",n:"",k0:1,inicio:S.month,dia:"",cat:"",divisao:"metade"};
  const baseDiv={valor:p.valor||0,divisao:divOf(p),parteA:divOf(p)==="custom"?r2((+p.valor||0)*(+p.pctA||0)):0};
  const {f,q}=formShell(isNew?"Nova compra parcelada":"Editar compra parcelada",`
    <label class="f full">Descrição<input name="desc" required value="${esc(p.desc)}" placeholder="Ex: Ar condicionado, Escola de inglês"></label>
    <label class="f full">Forma de pagamento<select name="forma">${formaOptions(formaKey(p))}</select></label>
    <label class="f">O valor informado é<select name="modo"><option value="parcela" ${p.modo!=="total"?"selected":""}>De cada parcela</option><option value="total" ${p.modo==="total"?"selected":""}>Total da compra</option></select></label>
    <label class="f">Valor (R$)<input name="valor" required inputmode="decimal" value="${fmtIn(p.valor)}"></label>
    <label class="f">Nº de parcelas<input name="n" type="number" min="1" max="120" required value="${esc(p.n)}"></label>
    <label class="f">Vertente<select name="cat" required>${catOptions(p.cat)}</select></label>
    <label class="f">Mês da parcela abaixo<input name="inicio" type="month" required value="${esc(p.inicio)}"></label>
    <label class="f">Parcela desse mês<input name="k0" type="number" min="1" max="120" required value="${esc(p.k0||1)}"></label>
    <p class="note full" style="margin:0">Compra nova: mês da 1ª parcela e "1". Já em andamento: mês atual e a parcela de agora (ex: 4). No cartão, use o mês da fatura.</p>
    <label class="f full">Dia do vencimento (boleto ou carnê)<input name="dia" type="number" min="1" max="31" value="${esc(p.dia)}"></label>
    ${divisaoFields(baseDiv)}
    <p class="note full" style="margin:-4px 0 0">A divisão vale sobre o valor informado e é aplicada na mesma proporção em cada parcela.</p>
    <div class="full box" id="planPrev" style="font-size:14px"></div>
  `,{submit:isNew?"Cadastrar parcelas":"Salvar", del:isNew?null:()=>deletePlan(p.id)});
  const read=()=>({...p,desc:q("desc").value.trim(),...parseForma(q("forma").value),meio:"",modo:q("modo").value,valor:parseMoney(q("valor").value),
    n:parseInt(q("n").value)||0,k0:parseInt(q("k0").value)||1,inicio:q("inicio").value,dia:parseInt(q("dia").value)||"",cat:q("cat").value});
  const prev=()=>{
    const x=read(), box=$("#planPrev");
    if(!(x.valor>0)||!(x.n>0)||!x.inicio){ box.textContent="Preencha valor, parcelas e mês para ver o resumo."; return; }
    if(x.k0>x.n){ box.innerHTML=`<span class="up">A parcela do mês (${x.k0}) é maior que o total (${x.n}).</span>`; return; }
    const dv=q("divisao").value, pct=x.valor?parseMoney(q("parteA").value)/x.valor:0;
    const sch=planSchedule(x), sh=planShare({divisao:dv,pctA:pct},planParcela(x));
    box.innerHTML=`<b>${x.n}x de ${moneyF(planParcela(x))}</b> (total ${moneyF(planTotal(x))}).<br>
      Por parcela: ${esc(nameA())} <b>${moneyF(sh.parteA)}</b>, ${esc(nameB())} <b>${moneyF(sh.parteB)}</b>.<br>
      Serão lançadas ${sch.length} parcela(s), de ${mY(sch[0].month)} a ${mY(sch[sch.length-1].month)}, somando ${moneyF(sum(sch))}.`;
  };
  wireDivisao(f,()=>setTimeout(prev,0));
  ["desc","n","k0","inicio"].forEach(n=>q(n).addEventListener("input",prev));
  ["modo","inicio"].forEach(n=>q(n).addEventListener("change",prev));
  prev();
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const x=read(), d=new FormData(f);
    if(!x.desc) return toast("Informe a descrição.");
    if(!(x.valor>0)) return toast("Valor inválido. Use o formato 1.250,90");
    if(!(x.n>=1&&x.n<=120)) return toast("Parcelas: entre 1 e 120.");
    if(x.k0<1||x.k0>x.n) return toast(`A parcela do mês deve estar entre 1 e ${x.n}.`);
    if(!x.inicio) return toast("Informe o mês.");
    if(!x.cat) return toast("Escolha a vertente.");
    const div=readDivisao(d,x.valor); if(!div) return;
    x.divisao=div.divisao; x.pctA=div.divisao==="custom"?div.parteA/x.valor:0;
    $("#dlg").close();
    await Store.put("parcelamentos",x);
    await syncPlan(x);
    toast(isNew?`${planSchedule(x).length} parcela(s) lançada(s)`:"Compra parcelada atualizada");
  };
  $("#dlg").showModal();
}

/* =====================================================================
   14. AÇÕES
   ===================================================================== */
function askConfirm(msg,okLabel){
  const d=$("#dlgc"); $("#dlgcM").textContent=msg; $("#dlgcOk").textContent=okLabel||"Confirmar"; d.returnValue="";
  return new Promise(res=>{ d.addEventListener("close",()=>res(d.returnValue==="yes"),{once:true}); d.showModal(); });
}
async function deleteEntry(id){
  const en=S.entries.find(x=>x.id===id); if(!en) return;
  const rr=en.recId&&S.recs.find(r=>r.id===en.recId);
  const copias=monthEntries(en.month).filter(x=>x.id!==en.id&&norm(x.desc)===norm(en.desc));
  const msg = copias.length ? `Excluir esta cópia de "${en.desc}"? A outra continua.`
    : rr ? `Excluir "${en.desc}" só de ${monthName(en.month)}? Os outros meses continuam.`
    : isParc(en) ? `Excluir a parcela "${en.desc}"? Para tirar a compra toda, exclua em "Fixas e parcelas".`
    : `Excluir "${en.desc}" (${moneyF(en.valor)})?`;
  if(!(await askConfirm(msg,"Excluir"))) return;
  if(rr&&!copias.length){   /* marca o mês como pulado para a conta não voltar */
    const upd={...rr,pulados:[...new Set([...(rr.pulados||[]),en.month])]};
    const i=S.recs.findIndex(x=>x.id===rr.id); if(i>=0) S.recs[i]=upd;
    await Store.put("fixas",upd);
  }
  await Store.del("lancamentos",id);
  toast("Excluído"); scheduleSync();
}
async function deleteRec(id){
  const r=S.recs.find(x=>x.id===id); if(!r) return;
  if(!(await askConfirm(`Excluir a conta fixa "${r.desc}"? Meses já pagos ficam no histórico; os futuros em aberto saem.`,"Excluir"))) return;
  S.recs=S.recs.filter(x=>x.id!==id);
  await Store.del("fixas",id); toast("Conta fixa excluída"); syncRecs();
}
async function deletePlan(id){
  const p=S.plans.find(x=>x.id===id); if(!p) return;
  const st=planStatus(p);
  if(!(await askConfirm(`Excluir "${p.desc}"? Saem ${st.abertas.length} parcela(s) em aberto (${moneyF(st.restante)}). As pagas ficam no histórico.`,"Excluir"))) return;
  for(const e of st.abertas) await Store.del("lancamentos",e.id);
  await Store.del("parcelamentos",id); toast("Compra parcelada excluída");
}
async function payCard(id){
  const card=cardById(id), pend=monthEntries(S.month).filter(x=>cardOf(x)===card.id&&!x.pago);
  if(!(await askConfirm(`Marcar a fatura de ${monthName(S.month)} (${card.nome}) como paga? ${pend.length} lançamento(s), ${money(sum(pend))}.`,"Fatura paga"))) return;
  for(const x of pend) await Store.put("lancamentos",{...x,pago:true,pagoEm:today(),atualizadoPor:S.me});
  await Store.setMonth(S.month,{faturaPaga:{...((S.meses[S.month]||{}).faturaPaga||{}),[card.id]:today()}});
  toast("Fatura marcada como paga");
}
async function exportCSV(onlyMonth){
  const src=onlyMonth?monthEntries(S.month):S.entries, n=v=>String(v).replace(".",",");
  const head=["Mês","Descrição","Valor","Vertente","Tipo","Forma","Parte "+nameA(),"Parte "+nameB(),"Pago","Estimado","Data","Vencimento","Observação"];
  const rows=[...src].sort((a,b)=>a.month.localeCompare(b.month)||a.desc.localeCompare(b.desc)).map(e=>{ const s=shareOf(e); return [e.month,e.desc,n(e.valor),cat(e.cat).nome,tipoLabel(e),formaChip(e),n(s.a),n(s.b),e.pago?"Sim":"Não",e.estimado?"Sim":"Não",e.data||"",e.venc||"",e.obs||""]; });
  rows.push(["","TOTAL",n(sum(src)),"","","",n(sumA(src)),n(sumB(src)),"","","","",""]);
  const csv="\ufeff"+[head,...rows].map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n");
  download(onlyMonth?`contas-${S.month}.csv`:"contas-nossa-casa.csv",csv,"text/csv");
}
function readRows(sel,fn){ return [...document.querySelectorAll(sel+" .row")].map(row=>fn(+row.dataset.i,k=>row.querySelector(`[data-k="${k}"]`).value.trim())); }
const readCats = () => readRows("#catEdit",(i,g)=>{ const b=S.config.categorias[i]; return {id:b.id,nome:g("nome")||b.nome,cor:g("cor"),orcamento:parseMoney(g("orcamento")||"0")}; });
const readCards = () => readRows("#cardEdit",(i,g)=>{ const b=S.config.cartoes[i]; return {id:b.id,nome:g("nome")||b.nome,fecha:parseInt(g("fecha"))||"",vence:parseInt(g("vence"))||""}; });

/* =====================================================================
   15. BUSCA
   ===================================================================== */
function runSearch(){
  const raw=$("#sq").value.trim(), q=norm(raw);
  $("#sscope").innerHTML=[["todos","Todos os meses"],["mes","Só "+monthName(S.month)]].map(([k,l])=>`<button class="pill" type="button" data-scope="${k}" aria-pressed="${S.sScope===k}">${esc(l)}</button>`).join("");
  if(q.length<2){ $("#sres").innerHTML=`<p class="note">Digite pelo menos 2 letras. Ex: aluguel, ifood, 787.</p>`; return; }
  const num=parseMoney(raw);
  let ents=S.entries.filter(e=>{ const hay=norm([e.desc,e.obs,cat(e.cat).nome,formaChip(e)].join(" ")); return q.split(/\s+/).every(w=>hay.includes(w))||(num>0&&Math.abs(e.valor-num)<0.005); });
  if(S.sScope==="mes") ents=ents.filter(e=>e.month===S.month);
  ents.sort((a,b)=>b.month.localeCompare(a.month)||b.valor-a.valor);
  const recs=S.recs.filter(r=>norm(r.desc).includes(q)), plans=S.plans.filter(p=>norm(p.desc).includes(q));
  const cad=[...recs.map(r=>`<div class="item" style="grid-template-columns:1fr auto auto"><div><div class="desc">${esc(r.desc)}</div><div class="info"><span class="chip">Conta fixa</span></div></div><div class="val">${money(r.valor)}</div><button class="btn small" data-sact="rec" data-id="${esc(r.id)}">Editar</button></div>`),
             ...plans.map(p=>`<div class="item" style="grid-template-columns:1fr auto auto"><div><div class="desc">${esc(p.desc)}</div><div class="info"><span class="chip">Parcelada</span><span>${p.n}x</span></div></div><div class="val">${money(planTotal(p))}</div><button class="btn small" data-sact="plan" data-id="${esc(p.id)}">Editar</button></div>`)].join("");
  $("#sres").innerHTML = (cad?`<div class="list mb">${cad}</div>`:"")
    + (ents.length?`<p style="margin:0 0 6px"><b>${ents.length} lançamento(s): ${money(sum(ents))}</b> <span class="note">(${esc(nameA())} ${money(sumA(ents))}, ${esc(nameB())} ${money(sumB(ents))})</span></p>
      <div class="list">${ents.slice(0,80).map(e=>`<div class="item" style="grid-template-columns:1fr auto auto"><div><div class="desc">${esc(e.desc)}</div><div class="info"><span class="chip">${mY(e.month)}</span><span class="chip">${esc(formaChip(e))}</span><span>${esc(cat(e.cat).nome)}</span></div></div><div class="val">${money(e.valor)}</div><button class="btn small" data-sact="entry" data-id="${esc(e.id)}">Abrir</button></div>`).join("")}</div>`
      : (cad?"":`<div class="empty"><p>Nada encontrado.</p></div>`));
}
function openSearch(){ $("#dlgs").showModal(); runSearch(); setTimeout(()=>$("#sq").focus(),30); }

const go = (patch) => { Object.assign(S,patch); render(); window.scrollTo({top:0,behavior:"smooth"}); };

$("#next").onclick=()=>go({month:shiftMonth(S.month,1)});

$("#tabs").onclick=e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;

};
$("#searchBtn").onclick=openSearch;
$("#sclose").onclick=()=>$("#dlgs").close();
$("#sq").addEventListener("input",()=>{ clearTimeout(runSearch._t); runSearch._t=setTimeout(runSearch,150); });
$("#dlgs").addEventListener("click",e=>{
  const sc=e.target.closest("[data-scope]"); if(sc){ S.sScope=sc.dataset.scope; runSearch(); return; }

document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"&&!document.body.classList.contains("locked")){ e.preventDefault(); openSearch(); } });
$("#fabBtn").onclick=()=>{ const o=!$("#fab").classList.contains("open"); $("#fab").classList.toggle("open",o); $("#fabBtn").setAttribute("aria-expanded",o); };

document.addEventListener("change",e=>{
  const t=e.target, act=t.dataset.act;
  if(t.dataset.filter){ S.filter[t.dataset.filter]=t.value; render(); return; }
  if(act==="importFile"){
    const file=t.files&&t.files[0]; t.value=""; if(!file) return;
    file.text().then(async txt=>{
      let data; try{ data=JSON.parse(txt); }catch(e){ return toast("Arquivo inválido."); }
      if(data.app!=="nossa-casa") return toast("Este arquivo não é um backup do Nossa Casa.");
      const n=(data.lancamentos||[]).length;
      if(!(await askConfirm(`Importar ${n} lançamentos, ${(data.fixas||[]).length} contas fixas e ${(data.parcelamentos||[]).length} compras parceladas?`,"Importar"))) return;
      toast("Importando...",8000);
      try{ const c=await Store.importAll(data); toast(`Importação concluída (${c} itens).`,4000); }catch(e){ toast("Falha na importação ("+(e.code||"erro")+")."); }
    });
    return;
  }
  if(act==="projVar"){ S.projVar=t.checked; render(); return; }
  if(act==="banco"){ const v=t.value.trim()?parseMoney(t.value):null; Store.setMonth(S.month,{faturas:{...((S.meses[S.month]||{}).faturas||{}),[t.dataset.id]:v}}); return; }
  if(act==="toggle"){ const en=S.entries.find(x=>x.id===t.dataset.id); if(!en) return;
    if(en.estimado&&t.checked){ t.checked=false; toast("Confirme o valor real antes de marcar como paga."); openEntry({...en,pago:true}); return; }
    Store.put("lancamentos",{...en,pago:t.checked,pagoEm:t.checked?today():"",atualizadoPor:S.me}); }
});

document.addEventListener("click",e=>{
  if(!e.target.closest("#fab")||e.target.closest(".fab-menu")){ $("#fab").classList.remove("open"); $("#fabBtn").setAttribute("aria-expanded","false"); }
  const b=e.target.closest("[data-act]"); if(!b||b.tagName==="INPUT") return;
  const id=b.dataset.id;
  const A={
    new:()=>openEntry(),
    newCard:()=>openEntry(),
    newCash:()=>openEntry(null,{forma:"avista"}),
    newPlan:()=>openPlan(),
    newRec:()=>openRec(),
    edit:()=>{ const en=S.entries.find(x=>x.id===id); if(en) openEntry(en); },
    editRec:()=>openRec(S.recs.find(x=>x.id===id)),
    delRec:()=>deleteRec(id),
    editPlan:()=>openPlan(S.plans.find(x=>x.id===id)),
    delPlan:()=>deletePlan(id),
    payCard:()=>payCard(id),
    goMonth:()=>go({month:id,notice:null}),
    noticeOff:()=>{ S.notice=null; render(); },
    goVert:()=>go({tab:"anal",sub:"vert",vert:id}),
    pickVert:()=>{ S.vert=id; render(); },
    goCard:()=>go({tab:"cartao",card:id}),
    goCardMonth:()=>go({tab:"cartao",card:id,month:b.dataset.m}),
    pickCard:()=>{ S.card=id; render(); },
    sub:()=>{ S.sub=id; render(); },
    projH:()=>{ S.projH=+id; render(); },
    close:()=>askConfirm(`Fechar ${monthName(S.month)} com custo de ${moneyF(sum(monthEntries(S.month)))}? Ainda dá para editar depois.`,"Fechar mês").then(ok=>{ if(ok) Store.setMonth(S.month,{fechado:true,total:sum(monthEntries(S.month)),por:S.me,em:new Date().toISOString()}).then(()=>toast("Mês fechado")); }),
    reopen:()=>Store.setMonth(S.month,{fechado:false}).then(()=>toast("Mês reaberto")),
    csv:()=>exportCSV(false),
    backup:()=>{
      const data={app:"nossa-casa",versao:1,geradoEm:new Date().toISOString(),config:S.config,lancamentos:S.entries,fixas:S.recs,parcelamentos:S.plans,meses:S.meses};
      download(`nossa-casa-backup-${today()}.json`,JSON.stringify(data),"application/json"); toast(`Backup gerado: ${S.entries.length} lançamentos`);
    },
    logout:()=>askConfirm("Sair do sistema neste aparelho?","Sair").then(ok=>{ if(ok) signOut(auth); }),
    resetPass:()=>sendPasswordResetEmail(auth,S.user.email).then(()=>toast("Link para nova senha enviado ao seu e-mail.",4000)).catch(()=>toast("Não foi possível enviar o e-mail.")),
    csvMes:()=>exportCSV(true),
    eye:()=>{ HIDE=!HIDE; try{ localStorage.setItem("nc-hide",HIDE?"1":"0"); }catch(_){} render(); if($("#dlgs").open) runSearch(); toast(HIDE?"Valores ocultos":"Valores visíveis"); },
    saveInicio:()=>Store.setConfig({...S.config,inicio:$("#inicioCtl").value||""}).then(()=>toast("Início do controle salvo")),
    savePeople:()=>Store.setConfig({...S.config,pessoas:{a:$("#pa").value.trim()||"Pessoa 1",b:$("#pb").value.trim()||"Pessoa 2"}}).then(()=>toast("Nomes salvos")),
    addCat:()=>{ const cs=readCats(); cs.push({id:"c"+uid(),nome:"Nova vertente",cor:PALETTE[cs.length%PALETTE.length],orcamento:0}); S.config={...S.config,categorias:cs}; render(); },
    rmCat:()=>{ const cs=readCats(), c=cs[+b.dataset.i];
      if(S.entries.some(x=>x.cat===c.id)||S.recs.some(x=>x.cat===c.id)||S.plans.some(x=>x.cat===c.id)) return toast("Essa vertente está em uso. Renomeie em vez de remover.");
      cs.splice(+b.dataset.i,1); S.config={...S.config,categorias:cs,removidas:[...new Set([...S.config.removidas,c.id])]}; render(); },
    saveCats:()=>Store.setConfig({...S.config,categorias:readCats()}).then(()=>toast("Vertentes salvas")),
    addCard:()=>{ const cs=readCards(); cs.push({id:"k"+uid(),nome:"Novo cartão",fecha:"",vence:""}); S.config={...S.config,cartoes:cs}; render(); },
    rmCard:()=>{ const cs=readCards(), k=cs[+b.dataset.i];
      if(cs.length<2) return toast("É preciso ter pelo menos um cartão.");
      if([...S.entries,...S.recs,...S.plans].some(x=>x.cartao===k.id)) return toast("Esse cartão está em uso. Renomeie em vez de remover.");
      cs.splice(+b.dataset.i,1); S.config={...S.config,cartoes:cs}; render(); },
    saveCards:()=>{ const cs=readCards(); if(cs.some(k=>(k.fecha&&(k.fecha<1||k.fecha>31))||(k.vence&&(k.vence<1||k.vence>31)))) return toast("Dias devem ficar entre 1 e 31."); Store.setConfig({...S.config,cartoes:cs}).then(()=>toast("Cartões salvos")); },
  };
  if(A[b.dataset.act]) A[b.dataset.act]();
});

Store.init();
})();
</script>
</body>
</html>
