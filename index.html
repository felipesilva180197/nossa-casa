<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nossa Casa | Contas do mês</title>
<meta name="theme-color" content="#1F4B47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nossa Casa">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --ink:#16302F; --ink-2:#4B615F; --line:#D5DDD9;
  --brand:#1F4B47; --sun:#E8B53A; --ok:#3E8E63; --bad:#C84B35; --soft:#E3EAE6; --parc:#8E6BB0;
  --pa:#5B7FB8; --pb:#B5557E;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D1C; --surface:#172928; --ink:#E6EFEC; --ink-2:#9DB2AE; --line:#2A403E;
    --brand:#7FC2B8; --sun:#F0C457; --ok:#6CC08F; --bad:#EF7B64; --soft:#1F3533; --parc:#B397D6;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D1C; --surface:#172928; --ink:#E6EFEC; --ink-2:#9DB2AE; --line:#2A403E;
  --brand:#7FC2B8; --sun:#F0C457; --ok:#6CC08F; --bad:#EF7B64; --soft:#1F3533; --parc:#B397D6;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 110px}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:14px;height:14px;background:var(--sun);border-radius:3px 3px 3px 0;transform:rotate(45deg)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.month button:hover{background:var(--soft)}
.month strong{min-width:150px;text-align:center;font-family:var(--display);font-weight:700;text-transform:capitalize}
.tools{display:flex;gap:6px;align-items:center}
.icon{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 10px;cursor:pointer;font-size:16px}
.icon:hover{background:var(--soft)}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 8px}

.tabs{display:flex;gap:2px;margin:18px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--sun)}

/* resumo */
.hero .label{color:var(--ink-2);font-size:14px}
.hero .total{font-family:var(--display);font-weight:800;font-size:clamp(42px,9vw,78px);line-height:1;letter-spacing:-.04em;margin:4px 0 10px}
.hero .sub{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.hero .sub b{color:var(--ink)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.person{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;border-left:5px solid var(--pa)}
.person.b{border-left-color:var(--pb)}
.person .k{font-size:13px;color:var(--ink-2)}
.person .v{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em}
.ribbon{display:flex;height:28px;border-radius:8px;overflow:hidden;margin:4px 0 8px;background:var(--soft)}
.ribbon span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2);margin-bottom:18px}
.legend em{font-style:normal;display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}

.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
.grid.eq{grid-template-columns:1fr 1fr}
@media (max-width:860px){.grid,.grid.eq{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.panel h2{font-family:var(--display);font-size:18px;margin:0 0 4px;font-weight:700}
.desc-h{font-size:13px;color:var(--ink-2);margin:0 0 12px}
.mb{margin-bottom:16px}
.note{font-size:13px;color:var(--ink-2)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--surface);padding:12px 14px}
.kpi .k{font-size:13px;color:var(--ink-2)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1.25}
.kpi .d{font-size:12px;color:var(--ink-2)}
.up{color:var(--bad);font-weight:700}
.down{color:var(--ok);font-weight:700}

.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}

.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:right;font-weight:600;color:var(--ink-2);padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
tr.sel td{background:var(--soft);font-weight:700}
tr.group td{background:var(--soft);font-weight:700}
tfoot td{font-weight:700;border-top:2px solid var(--line)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);color:var(--bg);border-color:var(--brand)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .desc{font-weight:600}
.item .info{font-size:12px;color:var(--ink-2);display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.item .val{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.item.paid .desc{color:var(--ink-2)}
.chip{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--ink-2);font-weight:600}
.chip.late{background:var(--bad);color:#fff}
.chip.ok{background:var(--ok);color:#fff}
.chip.est{background:var(--sun);color:#16302F}
.chk{width:22px;height:22px;accent-color:var(--ok);cursor:pointer}
.cardi{width:22px;text-align:center;font-size:17px}
.actions{display:flex;gap:2px}
.actions button,.pen{border:0;background:none;cursor:pointer;padding:6px;border-radius:6px;color:var(--ink-2)}
.actions button:hover,.pen:hover{background:var(--soft);color:var(--ink)}
.empty{text-align:center;padding:30px 12px;color:var(--ink-2)}
.empty p{margin:0 0 12px}

.checks .ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.checks .ck:last-child{border-bottom:0}
.ic{width:22px;height:22px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--ok)}
.ic.warn{background:var(--sun);color:#16302F}
.ic.err{background:var(--bad)}
.checks .sub{font-size:13px;color:var(--ink-2)}
.banner{padding:12px 16px;border-radius:12px;margin-bottom:16px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--sun) 25%,var(--surface))}
.banner.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface))}
.chart svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink-2);font-size:11px;font-family:var(--body)}
.legend-mini{display:flex;gap:14px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend-mini em{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}

/* formulários */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);padding:0;width:min(540px,94vw)}
dialog::backdrop{background:rgba(10,25,24,.45)}
dialog form,.dlgpad{padding:20px}
dialog h3{font-family:var(--display);margin:0 0 14px;font-size:20px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink-2)}
label.f input,label.f select,.inp{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--bg);font-weight:500;width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.box{border:1px solid var(--line);border-radius:10px;padding:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.settings .row{display:grid;grid-template-columns:auto 1fr 130px auto;gap:8px;align-items:center;padding:5px 0}
.settings .row.card{grid-template-columns:1fr 70px 70px auto}
.settings input[type=color]{width:38px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px}

/* botão lançar */
.fab{position:fixed;right:18px;bottom:18px;z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.fab-main{border:0;border-radius:999px;background:var(--sun);color:#16302F;font-weight:800;font-size:16px;padding:14px 22px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fab-menu{display:none;flex-direction:column;gap:6px;align-items:flex-end}
.fab.open .fab-menu{display:flex}
.fab-menu button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 16px;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}

/* bloqueio */
body.locked .wrap, body.locked .fab{display:none}
#lock{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px}
body.locked #lock{display:flex}
.lockbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(380px,100%);text-align:center}
.lockbox h1{font-family:var(--display);font-size:26px;margin:8px 0 4px}
.lockbox input{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;margin:14px 0 10px}

.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (max-width:600px){
  .item{grid-template-columns:auto 1fr auto}
  .item .actions{grid-column:2/-1;justify-content:flex-end}
  .fields{grid-template-columns:1fr}
  .settings .row{grid-template-columns:auto 1fr}
  .month strong{min-width:120px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body class="locked">
<div id="lock"><div class="lockbox">
  <div class="logo" style="justify-content:center"><i></i>Nossa Casa</div>
  <h1 id="lockTitle">Carregando...</h1>
  <p class="note" id="lockMsg"></p>
  <form id="lockForm" style="display:none">
    <input type="email" id="loginEmail" autocomplete="username" placeholder="E-mail" aria-label="E-mail">
    <input type="password" id="lockPass" autocomplete="current-password" placeholder="Senha" aria-label="Senha" style="margin-top:0">
    <button class="btn primary" style="width:100%" type="submit">Entrar</button>
    <button class="btn small" style="margin-top:10px" type="button" id="resetBtn">Esqueci a senha</button>
  </form>
</div></div>

<div class="wrap">
  <header class="top">
    <div class="logo"><i></i>Nossa Casa</div>
    <div class="month">
      <button id="prev" aria-label="Mês anterior">‹</button>
      <strong id="monthLabel"></strong>
      <button id="next" aria-label="Próximo mês">›</button>
    </div>
    <div class="tools">
      <button class="icon" id="searchBtn" title="Buscar contas (Ctrl+K)" aria-label="Buscar contas">🔍</button>
      <button class="icon" id="eyeBtn" data-act="eye"></button>
      <button class="icon" data-act="logout" title="Sair" aria-label="Sair">🚪</button>
      <select id="me" title="Quem está lançando (fica registrado no lançamento)" aria-label="Quem está lançando"></select>
    </div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="resumo">Resumo</button>
    <button role="tab" data-tab="lanc">Lançamentos</button>
    <button role="tab" data-tab="cartao">Cartão</button>
    <button role="tab" data-tab="rec">Fixas e parcelas</button>
    <button role="tab" data-tab="anal">Análises</button>
    <button role="tab" data-tab="ajustes">Ajustes</button>
  </nav>
  <div id="notice"></div>
  <main id="view"></main>
  <p class="note" id="status">Conectando...</p>
</div>

<div class="fab" id="fab">
  <div class="fab-menu">
    <button data-act="new">Despesa (cartão)</button>
    <button data-act="newCash">Despesa à vista</button>
    <button data-act="newPlan">Compra parcelada</button>
    <button data-act="newRec">Conta fixa (todo mês)</button>
  </div>
  <button class="fab-main" id="fabBtn" aria-expanded="false">+ Lançar</button>
</div>

<dialog id="dlg"><form method="dialog" id="form"></form></dialog>
<dialog id="dlgc"><form method="dialog"><h3>Confirmar</h3><p id="dlgcM" style="margin:0"></p><div class="dlg-actions"><button class="btn" value="no">Cancelar</button><button class="btn primary" value="yes" id="dlgcOk">Confirmar</button></div></form></dialog>
<dialog id="dlgs" style="width:min(720px,96vw)"><div class="dlgpad">
  <div style="display:flex;gap:8px">
    <input id="sq" class="inp" style="font-size:16px;padding:12px" placeholder="Buscar por descrição, vertente ou valor" autocomplete="off" aria-label="Buscar">
    <button class="btn" id="sclose" type="button">Fechar</button>
  </div>
  <div class="pills" style="margin-top:10px" id="sscope"></div>
  <div id="sres" style="margin-top:12px;max-height:60vh;overflow:auto"></div>
</div></dialog>
<div class="toast" id="toast"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* os dados do projeto Firebase ficam no arquivo config.js (não muda nas atualizações) */
let firebaseConfig={};
try{ ({firebaseConfig}=await import("./config.js")); }catch(e){ console.error("config.js não encontrado",e); }

(function(){
"use strict";
const $ = s => document.querySelector(s);

/* =====================================================================
   1. FORMATAÇÃO E DATAS
   ===================================================================== */
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
let HIDE = (()=>{ try{ return localStorage.getItem("nc-hide")==="1"; }catch(e){ return false; } })();
const moneyF = v => BRL.format(v||0);                          /* sempre mostra (formulários) */
const money  = v => HIDE ? "R$ •••••" : moneyF(v);             /* respeita o olho */
const moneyK = v => HIDE ? "•••" : (v>=1000 ? "R$ "+(v/1000).toFixed(1).replace(".",",")+"k" : "R$ "+Math.round(v||0));
const esc  = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = t => String(t??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const uid  = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad2 = n => String(n).padStart(2,"0");
const r2   = v => Math.round(v*100)/100;
const ym   = d => d.getFullYear()+"-"+pad2(d.getMonth()+1);
const curMonth = () => ym(new Date());
const today = () => { const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); };
const shiftMonth = (m,n) => { const [y,mo]=m.split("-").map(Number); return ym(new Date(y,mo-1+n,1)); };
const monthName = (m,short) => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo-1,1).toLocaleDateString("pt-BR",short?{month:"short"}:{month:"long",year:"numeric"}).replace(".",""); };
const mY = m => monthName(m,true)+"/"+m.slice(2,4);
const daysIn = m => { const [y,mo]=m.split("-").map(Number); return new Date(y,mo,0).getDate(); };
const fmtDate = d => d ? d.slice(8,10)+"/"+d.slice(5,7) : "";
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;
const parseMoney = s => {
  s=String(s??"").trim().replace(/[R$\s]/g,"");
  if(!s) return 0;
  if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");       /* 1.234,56 */
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");    /* 1.500 */
  const n=Number(s); return isFinite(n) ? r2(n) : 0;
};
const variation = (now,prev) => prev>0 ? (now-prev)/prev*100 : null;
const varHtml = (now,prev) => {
  const p=variation(now,prev);
  if(p===null) return `<span class="note">-</span>`;
  if(Math.abs(p)<0.05) return `<span class="note">igual</span>`;
  return `<span class="${p>0?"up":"down"}">${p>0?"▲":"▼"} ${Math.abs(p).toFixed(1).replace(".",",")}%</span>`;
};

/* =====================================================================
   2. CONFIGURAÇÃO PADRÃO
   ===================================================================== */
const PALETTE=["#1F6F66","#E8B53A","#C84B35","#5B7FB8","#8E6BB0","#3E8E63","#D07A2E","#B5557E","#6D8A96","#9AA84A","#2E9CB0","#7A5C3E"];
const DEFAULT_CATS=[
  {id:"moradia",nome:"Moradia",cor:"#1F6F66",orcamento:0},
  {id:"casa",nome:"Contas (luz, água, internet)",cor:"#5B7FB8",orcamento:0},
  {id:"mercado",nome:"Alimentação (mercado)",cor:"#E8B53A",orcamento:0},
  {id:"restaurante",nome:"Restaurantes e delivery",cor:"#D07A2E",orcamento:0},
  {id:"lazer",nome:"Lazer",cor:"#8E6BB0",orcamento:0},
  {id:"transporte",nome:"Transporte",cor:"#2E9CB0",orcamento:0},
  {id:"saude",nome:"Saúde",cor:"#3E8E63",orcamento:0},
  {id:"educacao",nome:"Educação",cor:"#7A5C3E",orcamento:0},
  {id:"assinaturas",nome:"Assinaturas",cor:"#6D8A96",orcamento:0},
  {id:"pessoal",nome:"Compras pessoais",cor:"#C84B35",orcamento:0},
  {id:"outros",nome:"Outros",cor:"#9AA84A",orcamento:0}
];
const DEFAULT_CARDS=[{id:"conjunto",nome:"Cartão conjunto",fecha:"",vence:""}];
function normalizeConfig(saved){
  const cfg=Object.assign({pessoas:{a:"Pessoa 1",b:"Pessoa 2"},categorias:[],removidas:[],cartoes:[]}, saved?JSON.parse(JSON.stringify(saved)):{});
  cfg.removidas=cfg.removidas||[];
  cfg.cartoes=(cfg.cartoes&&cfg.cartoes.length)?cfg.cartoes:JSON.parse(JSON.stringify(DEFAULT_CARDS));
  const renomes={lazer:["Lazer e restaurantes","Lazer"],casa:["Contas da casa","Contas (luz, água, internet)"],mercado:["Mercado","Alimentação (mercado)"]};
  const cats=(cfg.categorias||[]).map(c=>renomes[c.id]&&c.nome===renomes[c.id][0]?{...c,nome:renomes[c.id][1]}:c);
  DEFAULT_CATS.forEach(d=>{ if(!cats.some(c=>c.id===d.id)&&!cfg.removidas.includes(d.id)) cats.push({...d}); });
  cfg.categorias=cats;
  return cfg;
}

const S={

function setEntries(list){ S.entries=list; S._idx=null; }
function monthEntries(m){
  if(!S._idx){ S._idx={}; S.entries.forEach(e=>{ (S._idx[e.month]=S._idx[e.month]||[]).push(e); }); }

function toast(t,ms){ const el=$("#toast"); el.textContent=t; el.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("show"),ms||2600); }

/* =====================================================================
   4. DADOS (Firebase Firestore) E LOGIN (Firebase Authentication)
   ===================================================================== */
const configOk = !!firebaseConfig.apiKey && !Object.values(firebaseConfig).some(v=>v==="COLE_AQUI");
const fbApp = configOk ? initializeApp(firebaseConfig) : null;
const auth  = fbApp ? getAuth(fbApp) : null;
const db    = fbApp ? initializeFirestore(fbApp,{ignoreUndefinedProperties:true, localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})}) : null;
const Store={
  unsub:[],
  init(){
    if(!configOk){ showLogin("Configuração pendente","Preencha o arquivo config.js com os dados do seu projeto Firebase.",false); return; }
    onAuthStateChanged(auth,user=>{
      this.stop();
      S.user=user;
      if(!user){ S.loaded=false; showLogin(S.denied?"Sem acesso":"Entrar",S.denied||"Use o e-mail e a senha cadastrados.",true); S.denied=null; return; }
      document.body.classList.remove("locked");
      this.start();
    });
  },
  start(){
    const email=S.user.email;
    const err=e=>{
      if(e.code==="permission-denied"){ if(!S.denied){ S.denied=`O e-mail ${email} não tem permissão de acesso. Confira as regras do Firestore.`; signOut(auth); } return; }
      $("#status").textContent="Falha ao sincronizar ("+e.code+"). Recarregue a página.";
    };
    const col=(name,fn)=>this.unsub.push(onSnapshot(collection(db,name),{includeMetadataChanges:false},fn,err));
    this.unsub.push(onSnapshot(doc(db,"config","casa"),s=>{ S.config=normalizeConfig(s.exists()?s.data():null); render(); },err));
    col("lancamentos",s=>{ setEntries(s.docs.map(d=>d.data())); S.loaded=true; if(!s.metadata.fromCache){ S.gotE=true; scheduleSync(); } render(); });
    col("fixas",s=>{ S.recs=s.docs.map(d=>d.data()); if(!s.metadata.fromCache){ S.gotR=true; scheduleSync(); } render(); });
    col("parcelamentos",s=>{ S.plans=s.docs.map(d=>d.data()); render(); });
    col("meses",s=>{ const o={}; s.docs.forEach(d=>o[d.id]=d.data()); S.meses=o; render(); });
    $("#status").textContent=`Conectado como ${S.user.email}. Sincronizado em tempo real.`;
    render();
  },
  stop(){ this.unsub.forEach(u=>u()); this.unsub=[]; S.gotE=S.gotR=false; },
  async put(col,obj){ try{ await setDoc(doc(db,col,obj.id),obj); }catch(e){ fail(e); } },
  async del(col,id){ try{ await deleteDoc(doc(db,col,id)); }catch(e){ fail(e); } },
  async setMonth(m,patch){
    const data={...(S.meses[m]||{}),...patch}; S.meses={...S.meses,[m]:data};
    try{ await setDoc(doc(db,"meses",m),data); }catch(e){ fail(e); }
  },
  async setConfig(cfg){ S.config=cfg; try{ await setDoc(doc(db,"config","casa"),cfg); }catch(e){ fail(e); } render(); },
  async importAll(data){
    const ops=[];
    ops.push([doc(db,"config","casa"),normalizeConfig(data.config)]);
    (data.lancamentos||[]).forEach(o=>ops.push([doc(db,"lancamentos",o.id),o]));
    (data.fixas||[]).forEach(o=>ops.push([doc(db,"fixas",o.id),o]));
    (data.parcelamentos||[]).forEach(o=>ops.push([doc(db,"parcelamentos",o.id),o]));
    Object.entries(data.meses||{}).forEach(([k,v])=>ops.push([doc(db,"meses",k),v]));
    for(let i=0;i<ops.length;i+=400){
      const b=writeBatch(db);
      ops.slice(i,i+400).forEach(([ref,val])=>b.set(ref,val));
      await b.commit();
    }
    return ops.length;
  }
};

function showLogin(title,msg,form){

function download(filename,content,type){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([content],{type}));
  a.download=filename; document.body.appendChild(a); a.click();

}

const cat = id => S.config.categorias.find(c=>c.id===id) || {id, nome:"Sem vertente", cor:"#999", orcamento:0};
const allCats = () => { const ids=new Set(S.config.categorias.map(c=>c.id)); return [...S.config.categorias, ...[...new Set(S.entries.map(e=>e.cat))].filter(id=>!ids.has(id)).map(cat)]; };
const nameA = () => S.config.pessoas.a, nameB = () => S.config.pessoas.b;
const sum = arr => arr.reduce((a,e)=>a+Math.round((+e.valor||0)*100),0)/100;   /* em centavos */
const lastMonths = (n,end=S.month) => [...Array(n)].map((_,i)=>shiftMonth(end,i-n+1));
const catMonth = (id,m) => sum(monthEntries(m).filter(e=>e.cat===id));
const byCat = list => { const o={}; list.forEach(e=>{ (o[e.cat]=o[e.cat]||[]).push(e); }); return Object.entries(o).map(([id,l])=>({c:cat(id),v:sum(l),n:l.length})).sort((a,b)=>b.v-a.v); };
const counts = m => !S.config.inicio || m>=S.config.inicio;   /* mês faz parte do controle? */
function histAvg(fn,n=6){ const ms=lastMonths(n,shiftMonth(S.month,-1)).filter(m=>counts(m)&&monthEntries(m).length); return ms.length?avg(ms.map(fn)):0; }
const isClosed = m => !!(S.meses[m]&&S.meses[m].fechado);

/* tipo: fixa, parcela ou variável */
const isParc = e => e.tipo==="parcela" || !!e.planId;
const isFixa = e => e.tipo==="fixa" && !e.planId;
const isVar  = e => !isFixa(e) && !isParc(e);
const tipoLabel = e => isFixa(e)?"Fixa":isParc(e)?"Parcela":"Variável";
const recActiveIn = (r,m) => r.ativo!==false && (!r.inicio||m>=r.inicio) && (!r.fim||m<=r.fim) && !(r.pulados||[]).includes(m);

/* divisão: "a" só pessoa 1, "b" só pessoa 2, "metade", "custom" (parteA informada) */
const divOf = e => e.divisao || (e.quem==="a"?"a":e.quem==="b"?"b":"metade");
function shareOf(e){
  const t=Math.round((+e.valor||0)*100), dv=divOf(e);
  let a = dv==="a" ? t : dv==="b" ? 0 : dv==="metade" ? t-Math.floor(t/2) : Math.max(0,Math.min(t,Math.round((+e.parteA||0)*100)));
  return {a:a/100, b:(t-a)/100, dv};
}
const sumA = arr => arr.reduce((s,e)=>s+Math.round(shareOf(e).a*100),0)/100;
const sumB = arr => arr.reduce((s,e)=>s+Math.round(shareOf(e).b*100),0)/100;
function shareText(e){
  const s=shareOf(e);
  if(s.dv==="a") return `só ${nameA()}`;
  if(s.dv==="b") return `só ${nameB()}`;
  return `${nameA()} ${money(s.a)} / ${nameB()} ${money(s.b)}`;
}

/* forma de pagamento: cartão (qual), à vista ou boleto */
const FORMAS={avista:"À vista (dinheiro, Pix ou débito)",boleto:"Boleto ou débito automático"};
const FORMA_CURTA={avista:"À vista",boleto:"Boleto"};
function formaOf(e){
  if(e.forma) return e.forma;
  if(e.meio==="cartao") return "cartao";
  if(e.meio==="pix"||e.meio==="outro") return "avista";
  if(e.meio) return "boleto";
  return isFixa(e)?"boleto":"avista";
}
const cardById = id => S.config.cartoes.find(c=>c.id===id) || S.config.cartoes[0];
const cardOf = e => formaOf(e)!=="cartao" ? null : (S.config.cartoes.some(c=>c.id===e.cartao) ? e.cartao : S.config.cartoes[0].id);
const formaKey = e => formaOf(e)==="cartao" ? "cartao:"+cardOf(e) : formaOf(e);
const formaKeyLabel = k => k.startsWith("cartao:") ? cardById(k.slice(7)).nome : (FORMA_CURTA[k]||k);
const formaChip = e => formaKeyLabel(formaKey(e));
const parseForma = v => String(v||"").startsWith("cartao:") ? {forma:"cartao",cartao:v.slice(7)} : {forma:v||"avista",cartao:""};
const formaOptions = key => [...S.config.cartoes.map(c=>["cartao:"+c.id,"Cartão: "+c.nome]),...Object.entries(FORMAS)]
  .map(([v,l])=>`<option value="${esc(v)}" ${v===key?"selected":""}>${esc(l)}</option>`).join("");
const isLate = e => !e.pago && formaOf(e)!=="cartao" && e.venc && e.venc<today();

/* fatura: compras a partir do dia de fechamento vão para a fatura do mês seguinte; a fatura conta no mês em que vence */
function faturaMonth(card,dateStr){
  if(!dateStr) return null;
  let m=dateStr.slice(0,7);
  if(!card||!card.fecha) return m;
  if(+dateStr.slice(8,10) >= +card.fecha) m=shiftMonth(m,1);
  if(card.vence && +card.vence <= +card.fecha) m=shiftMonth(m,1);
  return m;
}
const faturaVenc = (card,m) => card&&card.vence ? `${m}-${pad2(Math.min(+card.vence,daysIn(m)))}` : "";
const faturaAtual = card => faturaMonth(card,today()) || curMonth();
function faturaInfo(card,m){
  const fecha=+card.fecha||0, vence=+card.vence||0;
  if(!fecha) return {venc:faturaVenc(card,m)};
  const closeM=(vence&&vence<=fecha)?shiftMonth(m,-1):m, iniM=shiftMonth(closeM,-1);
  const ini=`${iniM}-${pad2(Math.min(fecha,daysIn(iniM)))}`;
  const fim= fecha>1 ? `${closeM}-${pad2(Math.min(fecha-1,daysIn(closeM)))}` : `${iniM}-${pad2(daysIn(iniM))}`;
  return {ini, fim, fechaEm:`${closeM}-${pad2(Math.min(fecha,daysIn(closeM)))}`, venc:faturaVenc(card,m)};
}

/* =====================================================================
   7. COMPRAS PARCELADAS
   ===================================================================== */
function planSchedule(p){
  const out=[], n=+p.n, k0=+p.k0||1;
  const vC=Math.round((+p.valor||0)*100);
  const baseC = p.modo==="total" ? Math.floor(vC/n) : vC;
  const restoC = p.modo==="total" ? vC-baseC*n : 0;              /* centavo que sobra vai na 1ª */
  for(let k=k0;k<=n;k++) out.push({k, month:shiftMonth(p.inicio,k-k0), valor:(baseC+(k===1?restoC:0))/100});
  return out;
}
const planTotal = p => p.modo==="total" ? +p.valor : r2((+p.valor||0)*(+p.n||0));
const planParcela = p => p.modo==="total" ? Math.floor(Math.round(p.valor*100)/p.n)/100 : +p.valor;
const planEnd = p => shiftMonth(p.inicio,(+p.n)-(+p.k0||1));
function planShare(p,v){
  if(divOf(p)==="custom"){ const a=Math.round(v*100*(+p.pctA||0))/100; return {divisao:"custom",parteA:a,parteB:r2(v-a),quem:"conjunto"}; }
  const s=shareOf({valor:v,divisao:divOf(p)});
  return {divisao:s.dv,parteA:s.a,parteB:s.b,quem:s.dv==="a"?"a":s.dv==="b"?"b":"conjunto"};
}
function planStatus(p){
  const es=S.entries.filter(e=>e.planId===p.id);
  const abertas=es.filter(e=>!e.pago).sort((x,y)=>x.parcela-y.parcela);
  return {quitadas:(+p.k0||1)-1+es.filter(e=>e.pago).length, abertas, restante:sum(abertas), restA:sumA(abertas), restB:sumB(abertas), fim:planEnd(p)};
}
async function syncPlan(p){
  const existing=S.entries.filter(e=>e.planId===p.id), keep=new Set(), cur=curMonth();
  for(const x of planSchedule(p)){
    const id=`pc-${p.id}-${x.k}`; keep.add(id);
    const old=existing.find(e=>e.id===id);
    if(old&&old.pago) continue;
    const venc = p.dia ? `${x.month}-${pad2(Math.min(+p.dia,daysIn(x.month)))}` : (formaOf(p)==="cartao"?faturaVenc(cardById(cardOf(p)),x.month):"");
    await Store.put("lancamentos",Object.assign({}, old||{criadoPor:S.me,criadoEm:new Date().toISOString(),pago:x.month<cur,obs:""},{
      id, planId:p.id, parcela:x.k, month:x.month, desc:`${p.desc} (${x.k}/${p.n})`, valor:x.valor, cat:p.cat, tipo:"parcela",
      forma:formaOf(p), cartao:cardOf(p)||"", venc, data:"", estimado:false
    }, planShare(p,x.valor)));
  }
  for(const e of existing) if(!keep.has(e.id)&&!e.pago) await Store.del("lancamentos",e.id);
}

/* =====================================================================
   8. CONTAS FIXAS: lançadas sozinhas no mês atual e nos próximos 12
   ===================================================================== */
const HORIZON=12;
const SYNC_FIELDS=["desc","valor","cat","forma","cartao","quem","divisao","parteA","parteB","venc","estimado"];
const autoEditable = e => e.auto && !e.pago && !e.editadoManual;   /* só mexe no que ninguém editou */
function recEntryFor(r,m){
  const f=formaOf(r), card=f==="cartao"?cardById(cardOf(r)):null, sh=shareOf(r);
  return {id:`fx-${r.id}-${m}`, recId:r.id, month:m, desc:r.desc, valor:+r.valor, cat:r.cat, tipo:"fixa", forma:f, cartao:cardOf(r)||"",
    quem:r.quem||"conjunto", divisao:sh.dv, parteA:sh.a, parteB:sh.b, estimado:!!r.variavelValor,
    venc: r.dia ? `${m}-${pad2(Math.min(+r.dia,daysIn(m)))}` : (card?faturaVenc(card,m):"")};
}
function scheduleSync(){ if(!S.gotE||!S.gotR) return; clearTimeout(scheduleSync._t); scheduleSync._t=setTimeout(syncRecs,400); }
async function syncRecs(){
  if(S.syncing){ S.syncAgain=true; return; }
  S.syncing=true; let n=0;
  try{
    const months=[...Array(HORIZON+1)].map((_,i)=>shiftMonth(curMonth(),i));
    for(const r of [...S.recs]) for(const m of months){
      let ex=S.entries.find(e=>e.id===`fx-${r.id}-${m}`) || monthEntries(m).find(e=>e.recId===r.id);
      if(!recActiveIn(r,m)){ if(ex&&autoEditable(ex)){ await Store.del("lancamentos",ex.id); n++; } continue; }
      if(!ex){
        /* conta lançada à parte com o mesmo nome: liga ao cadastro em vez de duplicar */
        const solta=monthEntries(m).find(e=>isFixa(e)&&norm(e.desc)===norm(r.desc)&&(!e.recId||!S.recs.some(x=>x.id===e.recId)));
        if(solta){ await Store.put("lancamentos",{...solta,recId:r.id,editadoManual:true}); n++; continue; }
        await Store.put("lancamentos",{...recEntryFor(r,m),pago:false,data:"",obs:"",auto:true,criadoPor:S.me,criadoEm:new Date().toISOString()}); n++;
      } else if(autoEditable(ex)){
        const want=recEntryFor(r,m);
        if(SYNC_FIELDS.some(k=>(ex[k]??"")!==(want[k]??""))){ await Store.put("lancamentos",{...ex,...want,id:ex.id}); n++; }
      }
    }
    for(const e of S.entries.filter(e=>e.recId&&e.month>=curMonth()&&autoEditable(e)&&!S.recs.some(r=>r.id===e.recId))){ await Store.del("lancamentos",e.id); n++; }
  }catch(err){ console.error(err); }
  finally{
    S.syncing=false;
    if(n) toast(`Contas fixas atualizadas até ${monthName(shiftMonth(curMonth(),HORIZON))}`,3000);
    if(S.syncAgain){ S.syncAgain=false; scheduleSync(); }
  }
}

/* =====================================================================
   9. PROJEÇÃO
   ===================================================================== */
function varBase(){
  const ms=lastMonths(6,shiftMonth(curMonth(),-1)).filter(m=>counts(m)&&monthEntries(m).some(isVar)).slice(-3);
  if(!ms.length) return {v:0,pa:.5,n:0};
  const l=ms.flatMap(m=>monthEntries(m).filter(isVar)), t=sum(l);
  return {v:r2(t/ms.length), pa:t?sumA(l)/t:.5, n:ms.length};
}
function projMonth(m,vb){
  const cur=curMonth(), l=monthEntries(m);
  const fixItems=l.filter(isFixa);
  S.recs.filter(r=>recActiveIn(r,m)&&!l.some(e=>e.recId===r.id)).forEach(r=>fixItems.push(r));
  const parcItems=l.filter(isParc), realVar=l.filter(isVar);
  let vari=sum(realVar), va=sumA(realVar);
  if(m>=cur && S.projVar && vb.v>vari){ vari=vb.v; va=r2(vb.v*vb.pa); }   /* futuro: média dos variáveis, se maior que o já lançado */
  const fix=sum(fixItems), parc=sum(parcItems), total=r2(fix+parc+vari), a=r2(sumA(fixItems)+sumA(parcItems)+va);
  return {m,fix,parc,vari,total,a,b:r2(total-a)};
}

/* =====================================================================
   10. GRÁFICO DE BARRAS (fixas, variáveis, parcelas empilhadas)
   ===================================================================== */
function barChart(points,o={}){
  const W=o.w||600, H=o.h||210, top=22, bottom=26, pl=6, pr=6;
  const tot=p=>(p.v||0)+(p.v2||0)+(p.v3||0);
  const max=Math.max(1,...points.map(tot),o.avg||0,o.limit||0);
  const slot=(W-pl-pr)/points.length, bw=Math.min(44,slot*.62), base=H-bottom, hh=H-top-bottom;
  const y=v=>top+hh*(1-v/max);
  let s="";
  points.forEach((p,i)=>{
    const x=pl+i*slot+(slot-bw)/2, op=p.cur?1:(p.proj?.42:.62);
    let acc=0;
    [[p.v,o.c1||"var(--brand)"],[p.v2,o.c2||"var(--sun)"],[p.v3,o.c3||"var(--parc)"]].forEach(([v,c])=>{
      if(!v) return; const h=hh*v/max;
      s+=`<rect x="${x}" y="${base-acc-h}" width="${bw}" height="${h}" rx="3" fill="${c}" opacity="${op}"><title>${esc(p.label)}: ${money(v)}</title></rect>`; acc+=h;
    });
    if(tot(p)) s+=`<text x="${x+bw/2}" y="${y(tot(p))-6}" text-anchor="middle">${moneyK(tot(p))}</text>`;
    s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" style="font-weight:${p.cur?700:400}">${esc(p.label)}</text>`;
  });
  if(o.avg) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(o.avg)}" y2="${y(o.avg)}" stroke="var(--ink-2)" stroke-dasharray="4 4"/><text x="${W-pr}" y="${y(o.avg)-4}" text-anchor="end">média ${moneyK(o.avg)}</text>`;
  if(o.limit) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(o.limit)}" y2="${y(o.limit)}" stroke="var(--bad)" stroke-width="1.5"/><text x="${pl}" y="${y(o.limit)-4}" style="fill:var(--bad)">limite ${moneyK(o.limit)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||"Gráfico")}">${s}</svg>`;
}
const legendTipos = `<div class="legend-mini"><span><em style="background:var(--brand)"></em>Fixas</span><span><em style="background:var(--parc)"></em>Parcelas</span><span><em style="background:var(--sun)"></em>Variáveis</span><span>Barras claras: previsão</span></div>`;

/* =====================================================================
   11. PEÇAS DE TELA REUTILIZÁVEIS
   ===================================================================== */
const kpiBox = items => `<div class="kpis">${items.map(([k,v,d])=>`<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div>${d?`<div class="d">${d}</div>`:""}</div>`).join("")}</div>`;
const panel = (title,body,desc="",cls="") => `<section class="panel ${cls}"><h2>${title}</h2>${desc?`<p class="desc-h">${desc}</p>`:""}${body}</section>`;

}
const checkItem = (lvl,title,sub="") => `<div class="ck"><span class="ic ${lvl}">${lvl?"!":"✓"}</span><div><b>${title}</b>${sub?`<div class="sub">${sub}</div>`:""}</div></div>`;
const penList = arr => arr.slice(0,8).map(e=>`<button class="btn small" data-act="edit" data-id="${esc(e.id)}">✎ ${esc(e.desc)} ${money(e.valor)}</button>`).join(" ");

/* ---------- RESUMO ---------- */
function pendencias(list){
  const out=[], total=sum(list);
  const late=list.filter(isLate);
  if(late.length) out.push(checkItem("err",`${late.length} conta(s) vencida(s): ${money(sum(late))}`,penList(late)));
  const soon=list.filter(e=>!e.pago&&formaOf(e)!=="cartao"&&e.venc&&e.venc>=today()&&(new Date(e.venc)-new Date(today()))/864e5<=7);
  if(soon.length) out.push(checkItem("warn",`${soon.length} vence(m) nos próximos 7 dias`,soon.map(e=>`${esc(e.desc)} (${fmtDate(e.venc)})`).join(", ")));
  const est=list.filter(e=>e.estimado);
  if(est.length) out.push(checkItem("warn",`${est.length} valor(es) estimado(s): ${money(sum(est))}`,"Troque pelo valor real quando a conta chegar. "+penList(est)));
  const g={}; list.forEach(e=>{ const k=norm(e.desc)+"|"+e.valor; (g[k]=g[k]||[]).push(e); });
  const dups=Object.values(g).filter(a=>a.length>1).flat();
  if(dups.length) out.push(checkItem("err","Possível lançamento duplicado","Mesma descrição e valor. Exclua a cópia que sobra. "+penList(dups)));
  S.config.categorias.forEach(c=>{
    const v=sum(list.filter(e=>e.cat===c.id)), m=histAvg(mm=>catMonth(c.id,mm));
    if(c.orcamento&&v>c.orcamento) out.push(checkItem("err",`${esc(c.nome)} passou do limite em ${money(v-c.orcamento)}`));
    else if(m>0&&v>m*1.3&&v-m>50) out.push(checkItem("warn",`${esc(c.nome)} está ${Math.round((v/m-1)*100)}% acima da média`,`Média dos meses anteriores: ${money(m)}`));
  });
  if(Math.abs(sumA(list)+sumB(list)-total)>0.005) out.push(checkItem("err","A divisão entre vocês não fecha com o total","Algum lançamento tem divisão inválida."));
  return out;
}
function viewResumo(){
  const list=monthEntries(S.month), total=sum(list), prevM=shiftMonth(S.month,-1), prevT=sum(monthEntries(prevM));
  const pago=sum(list.filter(e=>e.pago)), cats=byCat(list), closed=isClosed(S.month);
  const hero=`<section class="hero">
    <div class="label">Custo da casa em ${esc(monthName(S.month))} ${closed?'<span class="chip ok">mês fechado</span>':""}</div>
    <div class="total">${money(total)}</div>
    <div class="sub"><span>Pago <b>${money(pago)}</b></span><span>A pagar <b>${money(total-pago)}</b></span>
      <span>Fixas <b>${money(sum(list.filter(isFixa)))}</b></span><span>Parcelas <b>${money(sum(list.filter(isParc)))}</b></span><span>Variáveis <b>${money(sum(list.filter(isVar)))}</b></span>
      ${prevT&&counts(prevM)?`<span>${varHtml(total,prevT)} vs ${mY(prevM)}</span>`:""}</div>
  </section>${personCards(sumA(list),sumB(list))}`;
  if(!list.length) return hero+emptyBox(`Nenhuma conta em ${esc(monthName(S.month))}.`);

  const ribbon=`<div class="ribbon">${cats.map(x=>`<span style="flex-grow:${x.v};background:${esc(x.c.cor)}" title="${esc(x.c.nome)}: ${money(x.v)}"></span>`).join("")}</div>
    <div class="legend">${cats.map(x=>`<span><em style="background:${esc(x.c.cor)}"></em>${esc(x.c.nome)} ${Math.round(x.v/total*100)}%</span>`).join("")}</div>`;

  const prevList=monthEntries(prevM);
  const vertentes=`<div class="tbl"><table><thead><tr><th>Vertente</th><th>Valor</th><th>Parte</th><th>vs mês ant.</th></tr></thead><tbody>
    ${cats.map(x=>`<tr class="click" data-act="goVert" data-id="${esc(x.c.id)}"><td><span class="dot" style="background:${esc(x.c.cor)}"></span> ${esc(x.c.nome)}</td><td>${money(x.v)}</td><td>${Math.round(x.v/total*100)}%</td><td>${counts(prevM)?varHtml(x.v,sum(prevList.filter(e=>e.cat===x.c.id))):"-"}</td></tr>`).join("")}
  </tbody></table></div>`;

  const vb=varBase(), cur=curMonth();
  const pts=[...Array(9)].map((_,k)=>shiftMonth(S.month,k-5)).map(m=>{
    if(m>cur){ const p=projMonth(m,vb); return {label:mY(m),v:p.fix,v2:p.vari,v3:p.parc,proj:true}; }
    const l=monthEntries(m); return {label:mY(m),v:sum(l.filter(isFixa)),v2:sum(l.filter(isVar)),v3:sum(l.filter(isParc)),cur:m===S.month};
  });
  const nx=projMonth(shiftMonth(S.month,1),vb);

  const formas={}; list.forEach(e=>{ const k=formaKey(e); (formas[k]=formas[k]||[]).push(e); });
  const formaRows=Object.entries(formas).sort((a,b)=>sum(b[1])-sum(a[1])).map(([k,l])=>[esc(formaKeyLabel(k)),l,k.startsWith("cartao:")?`class="click" data-act="goCard" data-id="${esc(k.slice(7))}"`:""]);

  const pend=pendencias(list);
  /* faturas vencidas ainda em aberto */
  S.config.cartoes.forEach(c=>{ for(let i=1;i<=3;i++){ const mm=shiftMonth(faturaAtual(c),-i), v=faturaVenc(c,mm), ab=monthEntries(mm).filter(e=>cardOf(e)===c.id&&!e.pago);
    if(ab.length&&(!v||v<=today())) pend.unshift(checkItem("warn",`Fatura de ${esc(monthName(mm))} (${esc(c.nome)}) ainda não foi marcada como paga`,`<button class="btn small" data-act="goCardMonth" data-id="${esc(c.id)}" data-m="${esc(mm)}">Abrir e marcar como paga</button>`)); } });
  const vista=list.filter(e=>formaOf(e)==="avista"), vistaP=total?Math.round(sum(vista)/total*100):0;
  const metaVista=`<div class="bar" style="height:10px"><i style="width:${100-vistaP}%;background:var(--ok)"></i></div>
    <p class="note" style="margin:6px 0 12px">${100-vistaP}% no cartão ou boleto, <b>${vistaP}% à vista</b> (${money(sum(vista))}). Meta: o mínimo possível à vista.${vista.length?" "+penList(vista.sort((a,b)=>b.valor-a.valor).slice(0,3)):""}</p>`;
  return hero+ribbon+`<div class="grid">
    <div class="stack">
      ${panel("Por vertente",vertentes,"Clique para ver a análise da vertente.")}
      ${panel("Evolução e previsão",barChart(pts,{label:"Evolução mensal"})+legendTipos,`Previsão de ${esc(monthName(nx.m))}: <b>${money(nx.total)}</b> (${esc(nameA())} ${money(nx.a)}, ${esc(nameB())} ${money(nx.b)}).`,"chart")}
    </div>
    <div class="stack">
      ${panel("Pendências do mês",`<div class="checks">${pend.length?pend.join(""):checkItem("","Tudo em ordem","Nenhuma pendência encontrada.")}</div>
        <div class="dlg-actions">${closed?`<button class="btn small" data-act="reopen">Reabrir mês</button>`:`<button class="btn small primary" data-act="close">Fechar mês</button>`}<button class="btn small" data-act="csvMes">Baixar CSV do mês</button></div>`)}
      ${panel("Por forma de pagamento",metaVista+totalsTable(formaRows),"Clique no cartão para ver a fatura.")}
    </div>
  </div>`;
}

/* ---------- LANÇAMENTOS ---------- */

  const f=S.filter, all=monthEntries(S.month);
  const list=all.filter(e=>(!f.cat||e.cat===f.cat)&&(!f.forma||formaKey(e)===f.forma)
    &&(!f.tipo||(f.tipo==="fixa"?isFixa(e):f.tipo==="parcela"?isParc(e):isVar(e)))

    <select data-filter="status" aria-label="Situação">${opt("",f.status,"Pagas e a pagar")}${opt("pendente",f.status,"A pagar")}${opt("pago",f.status,"Pagas")}${opt("estimado",f.status,"Estimadas")}</select>

/* ---------- CARTÃO ---------- */
function cardItems(cardId,m){
  const l=monthEntries(m).filter(e=>cardOf(e)===cardId);
  const faltam=S.recs.filter(r=>recActiveIn(r,m)&&formaOf(r)==="cartao"&&cardOf(r)===cardId&&!l.some(e=>e.recId===r.id));
  return {l,faltam};
}
function viewCartao(){
  const cards=S.config.cartoes;
  if(!cards.some(c=>c.id===S.card)) S.card=cards[0].id;
  const card=cardById(S.card), m=S.month, info=faturaInfo(card,m), atual=faturaAtual(card);
  const {l:list,faltam}=cardItems(card.id,m);
  const total=sum(list), fp=((S.meses[m]||{}).faturaPaga||{})[card.id];

  const head=`<div class="toolbar">
    ${cards.length>1?`<div class="pills">${cards.map(c=>`<button class="pill" data-act="pickCard" data-id="${esc(c.id)}" aria-pressed="${c.id===card.id}">💳 ${esc(c.nome)}</button>`).join("")}</div>`:`<b>💳 ${esc(card.nome)}</b>`}
    <span class="spacer"></span>
    ${m!==atual?`<button class="btn small primary" data-act="goMonth" data-id="${esc(atual)}">Ir para a fatura atual (${esc(mY(atual))})</button>`:`<span class="chip ok">fatura aberta agora</span>`}
  </div>
  <p class="note" style="margin:0 0 12px">${info.ini?`Fatura de <b>${esc(monthName(m))}</b>: compras de ${fmtDate(info.ini)} a ${fmtDate(info.fim)}, fecha em ${fmtDate(info.fechaEm)}, vence em <b>${fmtDate(info.venc)}</b>.`:`Informe o dia de fechamento e vencimento em Ajustes para o sistema escolher a fatura sozinho.`}${fp?` <span class="chip ok">paga em ${fmtDate(fp)}</span>`:""}</p>`;

  /* conferência */
  const faltaParc=[];
  S.plans.filter(p=>cardOf(p)===card.id).forEach(p=>{ const x=planSchedule(p).find(r=>r.month===m); if(x&&!list.some(e=>e.planId===p.id&&e.parcela===x.k)) faltaParc.push(`${esc(p.desc)} (${x.k}/${p.n})`); });
  const fora=info.ini?list.filter(e=>isVar(e)&&e.data&&(e.data<info.ini||e.data>info.fim)):[];
  const semData=list.filter(e=>isVar(e)&&!e.data);
  const banco=((S.meses[m]||{}).faturas||{})[card.id];
  const diff=banco!=null&&banco!==""?r2(banco-total):null;
  const checks=[
    faltaParc.length?checkItem("err",`${faltaParc.length} parcela(s) esperada(s) não estão aqui`,faltaParc.join(", ")):checkItem("","Parcelas conferidas"),
    faltam.length?checkItem("err",`${faltam.length} conta(s) fixa(s) do cartão sem lançamento`,faltam.map(r=>esc(r.desc)).join(", ")):checkItem("","Contas fixas conferidas"),
    fora.length?checkItem("warn",`${fora.length} compra(s) com data fora do período`,penList(fora)):"",
    semData.length?checkItem("warn",`${semData.length} compra(s) sem data`,penList(semData)):"",
    diff===null?checkItem("warn","Digite o valor da fatura do banco para conferir"):Math.abs(diff)<0.005?checkItem("","Bate com o banco"):checkItem("err",`Diferença de ${money(Math.abs(diff))} para o banco`,diff>0?"O banco cobra mais: falta lançar alguma compra.":"O sistema tem mais: veja duplicidades ou compras no cartão errado.")
  ].join("");
  const conf=panel("Está tudo lançado?",`<div class="checks">${checks}</div>
    <label class="f" style="margin-top:10px">Valor da fatura no app do banco (R$)<input data-act="banco" data-id="${esc(card.id)}" inputmode="decimal" value="${banco!=null&&banco!==""?String(banco).replace(".",","):""}" placeholder="Ex: 2.350,80"></label>
    ${!fp?`<div class="dlg-actions"><button class="btn primary" data-act="payCard" data-id="${esc(card.id)}">Marcar fatura inteira como paga</button></div>`:""}`);

  const grupo=(t,arr)=>arr.length?`<tr class="group"><td colspan="5">${t} (${arr.length})</td></tr>`+arr.map(e=>{ const sh=shareOf(e); return `<tr class="click" data-act="edit" data-id="${esc(e.id)}"><td>${e.data?fmtDate(e.data)+" ":""}${esc(e.desc)}${e.estimado?' <span class="chip est">estimado</span>':""}</td><td>${money(e.valor)}</td><td>${sh.a?money(sh.a):"-"}</td><td>${sh.b?money(sh.b):"-"}</td><td>✎</td></tr>`; }).join(""):"";
  const byDate=a=>[...a].sort((x,y)=>(x.data||"").localeCompare(y.data||"")||x.desc.localeCompare(y.desc));
  const tabela=list.length?`<div class="tbl"><table><thead><tr><th>Lançamento</th><th>Valor</th><th>${esc(nameA())}</th><th>${esc(nameB())}</th><th></th></tr></thead><tbody>
    ${grupo("Parcelas",byDate(list.filter(isParc)))}${grupo("Contas fixas",byDate(list.filter(isFixa)))}${grupo("Compras",byDate(list.filter(isVar)))}
    </tbody><tfoot><tr><td>Total da fatura</td><td>${money(total)}</td><td>${money(sumA(list))}</td><td>${money(sumB(list))}</td><td></td></tr></tfoot></table></div>`
    :`<div class="empty"><p>Nada lançado nesta fatura.</p><button class="btn primary" data-act="newCard">Lançar compra no cartão</button></div>`;

  const prox=[...Array(6)].map((_,i)=>{ const mm=shiftMonth(m,i+1), x=cardItems(card.id,mm), it=[...x.l,...x.faltam]; return {mm,it}; });
  const proxT=`<div class="tbl"><table><thead><tr><th>Fatura</th><th>Já garantido</th><th>${esc(nameA())}</th><th>${esc(nameB())}</th></tr></thead><tbody>
    ${prox.map(x=>`<tr class="click" data-act="goMonth" data-id="${esc(x.mm)}"><td>${esc(monthName(x.mm))}</td><td><b>${money(sum(x.it))}</b></td><td>${money(sumA(x.it))}</td><td>${money(sumB(x.it))}</td></tr>`).join("")}</tbody></table></div>`;

  return head+`<section class="hero"><div class="label">Total da fatura</div><div class="total" style="font-size:clamp(36px,7vw,56px)">${money(total)}</div></section>`
    +personCards(sumA(list),sumB(list))
    +`<div class="grid"><div class="stack">${panel("Lançamentos da fatura",tabela,"Clique numa linha para editar ou excluir.")}</div>
      <div class="stack">${conf}${panel("Próximas faturas",proxT,"Parcelas e fixas já lançadas. Compras novas somam por cima.")}</div></div>`;
}

/* ---------- FIXAS E PARCELAS ---------- */
function viewRec(){
  const m=S.month, prevM=shiftMonth(m,-1), list=monthEntries(m);
  /* duplicadas */
  const g={}; list.filter(isFixa).forEach(e=>{ (g[norm(e.desc)]=g[norm(e.desc)]||[]).push(e); });
  const dups=Object.values(g).filter(a=>a.length>1).flat();
  const dupHtml=dups.length?`<div class="banner" style="background:color-mix(in srgb,var(--bad) 18%,var(--surface))">Conta fixa duplicada em ${esc(monthName(m))}. Exclua a cópia: ${penList(dups)}</div>`:"";

  const recs=[...S.recs].sort((a,b)=>(a.ativo===false)-(b.ativo===false)||(+a.dia||99)-(+b.dia||99));
  const ativos=S.recs.filter(r=>recActiveIn(r,m));
  const recRow=r=>{
    const c=cat(r.cat), e=list.find(x=>x.recId===r.id), ep=monthEntries(prevM).find(x=>x.recId===r.id);
    const status = r.ativo===false?`<span class="chip">pausada</span>`:!recActiveIn(r,m)?`<span class="chip">fora do período</span>`:"";
    return `<div class="item">
      <span class="dot" style="background:${esc(c.cor)}"></span>
      <div><div class="desc">${esc(r.desc)}</div><div class="info">
        ${r.dia?`<span>dia ${r.dia}</span>`:""}<span class="chip">${esc(formaChip(r))}</span><span>${esc(shareText(r))}</span>
        ${r.fim?`<span class="chip">até ${mY(r.fim)}</span>`:""}${r.variavelValor?`<span class="chip est">valor varia</span>`:""}${status}
        ${e?`<span>${esc(monthName(m,true))}: ${money(e.valor)} ${ep?varHtml(e.valor,ep.valor):""} <button class="pen" data-act="edit" data-id="${esc(e.id)}" aria-label="Editar este mês">✎ este mês</button></span>`:""}
      </div></div>
      <div class="val">${money(r.valor)}</div>
      <div class="actions"><button data-act="editRec" data-id="${esc(r.id)}" aria-label="Editar cadastro">✎</button><button data-act="delRec" data-id="${esc(r.id)}" aria-label="Excluir cadastro">✕</button></div>
    </div>`;
  };
  const fixas=panel(`Contas fixas <span class="note" style="font-weight:500">${money(sum(ativos))} por mês</span>`,

  const plans=[...S.plans].sort((a,b)=>planEnd(a).localeCompare(planEnd(b)));

        <div class="bar"><i style="width:${Math.round(st.quitadas/p.n*100)}%;background:${esc(c.cor)}"></i></div>
        ${st.abertas.length?`<details style="margin-top:6px"><summary style="cursor:pointer;font-size:13px;font-weight:600">Parcelas em aberto (${st.abertas.length})</summary>

          ${st.abertas.map(e=>{ const s2=shareOf(e); return `<tr class="click" data-act="edit" data-id="${esc(e.id)}"><td>${mY(e.month)}</td><td>${e.parcela}/${p.n}</td><td>${money(e.valor)}</td><td>${money(s2.a)}</td><td>${money(s2.b)}</td></tr>`; }).join("")}
          </tbody></table></div></details>`:""}

      <div class="actions"><button data-act="editPlan" data-id="${esc(p.id)}" aria-label="Editar">✎</button><button data-act="delPlan" data-id="${esc(p.id)}" aria-label="Excluir">✕</button></div>

}

/* ---------- ANÁLISES ---------- */
function viewAnal(){
  const tabs=`<div class="pills mb">${[["vert","Vertentes de gastos"],["proj","Previsão dos próximos meses"]].map(([k,l])=>`<button class="pill" data-act="sub" data-id="${k}" aria-pressed="${S.sub===k}">${l}</button>`).join("")}</div>`;
  return tabs+(S.sub==="vert"?viewVert():viewProj());
}
function viewVert(){
  const months=lastMonths(6);
  const rows=allCats().map(c=>{ const vals=months.map(m=>catMonth(c.id,m)); return {c,vals,media:histAvg(m=>catMonth(c.id,m))}; })
    .filter(r=>r.vals.some(v=>v>0)).sort((a,b)=>b.vals[5]-a.vals[5]||b.media-a.media);
  if(!rows.length) return emptyBox("Ainda não há gastos para analisar.");
  if(!rows.some(r=>r.c.id===S.vert)) S.vert=rows[0].c.id;
  const heat=rows.map(r=>{ const mx=Math.max(...r.vals,1); return `<tr class="click ${r.c.id===S.vert?"sel":""}" data-act="pickVert" data-id="${esc(r.c.id)}">
    <td><span class="dot" style="background:${esc(r.c.cor)}"></span> ${esc(r.c.nome)}</td>
    ${r.vals.map((v,i)=>`<td style="background:${v?`color-mix(in srgb,${r.c.cor} ${Math.round(8+40*v/mx)}%,transparent)`:"transparent"};${i===5?"font-weight:700":""}">${v?money(v):"-"}</td>`).join("")}
    <td>${money(r.media)}</td><td>${varHtml(r.vals[5],r.vals[4])}</td></tr>`; }).join("");
  const colT=months.map(m=>sum(monthEntries(m)));
  const mapa=panel("Mapa das vertentes",`<div class="tbl"><table><thead><tr><th>Vertente</th>${months.map(m=>`<th>${mY(m)}</th>`).join("")}<th>Média</th><th>vs ant.</th></tr></thead>
    <tbody>${heat}</tbody><tfoot><tr><td>Total</td>${colT.map(v=>`<td>${money(v)}</td>`).join("")}<td>${money(histAvg(m=>sum(monthEntries(m))))}</td><td>${varHtml(colT[5],colT[4])}</td></tr></tfoot></table></div>`,
    "Cor mais forte, gasto maior. Clique numa vertente para detalhar.","mb");

  const c=cat(S.vert), list=monthEntries(S.month).filter(e=>e.cat===c.id), cur=sum(list);
  const media=histAvg(m=>catMonth(c.id,m)), tot=sum(monthEntries(S.month));
  const m12=lastMonths(12);
  const freq={};
  lastMonths(6).forEach(m=>monthEntries(m).filter(e=>e.cat===c.id).forEach(e=>{ const k=norm(e.desc.replace(/\s*\(\d+\/\d+\)$/,"")); freq[k]=freq[k]||{n:e.desc.replace(/\s*\(\d+\/\d+\)$/,""),q:0,v:0}; freq[k].q++; freq[k].v+=+e.valor||0; }));
  const top=Object.values(freq).sort((a,b)=>b.v-a.v).slice(0,8);
  return mapa+`<h2 style="font-family:var(--display);margin:0 0 10px"><span class="dot" style="background:${esc(c.cor)}"></span> ${esc(c.nome)}</h2>`
    +kpiBox([
      [`Em ${esc(monthName(S.month,true))}`,money(cur),`${varHtml(cur,catMonth(c.id,shiftMonth(S.month,-1)))} vs mês anterior`],
      ["Média anterior",money(media),media?`${varHtml(cur,media)} este mês vs média`:""],
      ["Parte do mês",`${tot?Math.round(cur/tot*100):0}%`,`de ${money(tot)}`],
      ["Limite mensal",c.orcamento?money(c.orcamento):"-",c.orcamento?(cur>c.orcamento?`<span class="up">passou ${money(cur-c.orcamento)}</span>`:`sobram ${money(c.orcamento-cur)}`):"defina em Ajustes"]
    ])
    +`<div class="grid">
      ${panel("Últimos 12 meses",barChart(m12.map(m=>({label:mY(m),v:catMonth(c.id,m),cur:m===S.month})),{c1:c.cor,avg:media,limit:c.orcamento,label:"Vertente por mês"}),"","chart")}
      ${panel("Onde o dinheiro vai",top.length?`<div class="tbl"><table><thead><tr><th>Descrição</th><th>Vezes</th><th>Total</th></tr></thead><tbody>${top.map(t=>`<tr><td>${esc(t.n)}</td><td>${t.q}</td><td>${money(t.v)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">Sem lançamentos.</p>`,"Últimos 6 meses, agrupado pela descrição.")}
    </div>`;
}
function viewProj(){
  const vb=varBase(), cur=curMonth();
  const months=[...Array(S.projH)].map((_,i)=>shiftMonth(S.month,i)), rows=months.map(m=>projMonth(m,vb));
  const media=avg(rows.map(r=>r.total));
  const alivio={};
  S.plans.forEach(p=>{ const nx=shiftMonth(planEnd(p),1); if(planStatus(p).abertas.length&&months.includes(nx)) (alivio[nx]=alivio[nx]||[]).push({n:p.desc,v:planParcela(p)}); });
  S.recs.forEach(r=>{ if(r.ativo===false||!r.fim) return; const nx=shiftMonth(r.fim,1); if(months.includes(nx)&&r.fim>=cur) (alivio[nx]=alivio[nx]||[]).push({n:r.desc,v:+r.valor}); });
  const saldo=sum(S.entries.filter(e=>isParc(e)&&!e.pago));
  const controls=`<div class="toolbar"><div class="pills">${[6,12,24].map(h=>`<button class="pill" data-act="projH" data-id="${h}" aria-pressed="${S.projH===h}">${h} meses</button>`).join("")}</div>
    <label class="check" style="font-weight:500"><input type="checkbox" data-act="projVar" ${S.projVar?"checked":""}> Somar variáveis pela média ${vb.n?`(${money(vb.v)}/mês)`:"(sem histórico ainda)"}</label></div>`;
  const tabela=`<div class="tbl"><table><thead><tr><th>Mês</th><th>Fixas</th><th>Parcelas</th><th>Variáveis</th><th>Total</th><th>${esc(nameA())}</th><th>${esc(nameB())}</th></tr></thead><tbody>
    ${rows.map(r=>`<tr class="click" data-act="goMonth" data-id="${esc(r.m)}"><td>${esc(monthName(r.m))}${alivio[r.m]?' <span class="chip ok">alívio</span>':""}</td><td>${money(r.fix)}</td><td>${r.parc?money(r.parc):"-"}</td><td>${r.vari?money(r.vari):"-"}</td><td><b>${money(r.total)}</b></td><td>${money(r.a)}</td><td>${money(r.b)}</td></tr>`).join("")}
    </tbody></table></div>`;
  const alivios=Object.keys(alivio).sort().map(mm=>`<div class="ck"><span class="ic">✓</span><div>A partir de <b>${esc(monthName(mm))}</b> saem ${alivio[mm].map(x=>esc(x.n)).join(", ")}: ${money(r2(alivio[mm].reduce((a,x)=>a+x.v,0)))} a menos por mês.</div></div>`).join("");
  return controls+kpiBox([
      [`${esc(monthName(rows[0].m))}`,money(rows[0].total),`${esc(nameA())} ${money(rows[0].a)}, ${esc(nameB())} ${money(rows[0].b)}`],
      ["Média prevista",money(media),`nos próximos ${S.projH} meses`],
      ["Saldo parcelado",money(saldo),"total de parcelas em aberto"]
    ])
    +panel("Custo mês a mês",barChart(rows.map(r=>({label:mY(r.m),v:r.fix,v2:r.vari,v3:r.parc,cur:r.m===cur,proj:r.m>cur})),{avg:media,label:"Previsão",w:Math.max(600,S.projH*48)})+legendTipos,"","chart mb")
    +`<div class="grid">${panel("Detalhe da previsão",tabela,"Meses passados com valores reais. Futuros com fixas, parcelas e, se marcado, a média dos variáveis. Clique para abrir o mês.")}
      ${panel("Quando o orçamento alivia",alivios?`<div class="checks">${alivios}</div>`:`<p class="note">Nenhuma parcela ou conta com prazo termina neste período.</p>`)}</div>`;
}

const catOptions = sel => `<option value="" ${sel?"":"selected"} disabled>Escolha a vertente</option>`+S.config.categorias.map(c=>`<option value="${esc(c.id)}" ${c.id===sel?"selected":""}>${esc(c.nome)}</option>`).join("");

function divisaoFields(o){

      <label class="f">Parte de ${A} (R$)<input name="parteA" inputmode="decimal" value="${fmtIn(sh.a)}"></label>
      <label class="f">Parte de ${B} (R$)<input name="parteB" inputmode="decimal" value="${fmtIn(sh.b)}"></label>
    </div>
    <p class="note" data-divprev style="margin:8px 0 0"></p></div>`;

function wireDivisao(f,onChange){
  const q=n=>f.querySelector(`[name="${n}"]`);
  const upd=src=>{
    const t=parseMoney(q("valor").value), dv=q("divisao").value, custom=dv==="custom";
    ["parteA","parteB"].forEach(n=>{ q(n).readOnly=!custom; q(n).style.opacity=custom?1:.6; });
    if(!custom){ const s=shareOf({valor:t,divisao:dv}); q("parteA").value=fmtIn(s.a); q("parteB").value=fmtIn(s.b); }
    else if(src==="parteB") q("parteA").value=fmtIn(r2(t-parseMoney(q("parteB").value)));
    else if(src!=="init") q("parteB").value=fmtIn(r2(t-parseMoney(q("parteA").value)));
    const a=parseMoney(q("parteA").value), b=parseMoney(q("parteB").value), ok=Math.abs(a+b-t)<0.005&&a>=0&&b>=0;
    f.querySelector("[data-divprev]").innerHTML = !(t>0) ? "Informe o valor para calcular as partes."
      : ok ? `${esc(nameA())} paga <b>${moneyF(a)}</b> e ${esc(nameB())} paga <b>${moneyF(b)}</b>.` : `<span class="up">As partes somam ${moneyF(a+b)}, mas o valor é ${moneyF(t)}.</span>`;
    if(onChange) onChange();
  };
  q("valor").addEventListener("input",()=>upd("valor"));
  q("divisao").addEventListener("change",()=>upd("divisao"));
  q("parteA").addEventListener("input",()=>upd("parteA"));
  q("parteB").addEventListener("input",()=>upd("parteB"));
  upd("init"); return upd;
}
function readDivisao(d,total){
  const dv=d.get("divisao")||"metade";
  let a=shareOf({valor:total,divisao:dv}).a;
  if(dv==="custom"){
    a=parseMoney(d.get("parteA")); const b=parseMoney(d.get("parteB"));
    if(a<0||b<0||Math.abs(a+b-total)>0.005){ toast(`As partes somam ${moneyF(a+b)}, mas o valor é ${moneyF(total)}.`); return null; }
  }
  const s=shareOf({valor:total,divisao:dv,parteA:a});
  return {divisao:dv,parteA:s.a,parteB:s.b,quem:dv==="a"?"a":dv==="b"?"b":"conjunto"};
}
function formShell(title,body,{del,submit}){
  const f=$("#form");
  f.innerHTML=`<h3>${title}</h3><div class="fields">${body}</div>
    <div class="dlg-actions">${del?`<button class="btn danger" type="button" data-del style="margin-right:auto">Excluir</button>`:""}<button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">${submit}</button></div>`;
  f.querySelector("[data-close]").onclick=()=>$("#dlg").close();
  if(del) f.querySelector("[data-del]").onclick=()=>{ $("#dlg").close(); del(); };
  return {f, q:n=>f.querySelector(`[name="${n}"]`)};
}
